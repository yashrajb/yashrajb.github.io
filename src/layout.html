<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="{{ogType}}">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ogImage}}">
<script src="{{root}}js/theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap">
<link rel="stylesheet" href="{{root}}css/theme.css">
<link rel="stylesheet" href="{{root}}css/base.css">
<link rel="stylesheet" href="{{root}}css/header.css">
<link rel="stylesheet" href="{{root}}css/sections.css">
<link rel="stylesheet" href="{{root}}css/footer.css">
<script type="application/ld+json">{{jsonld}}</script>
</head>
<body>
{{header}}
<main>
<div class="wrap">
{{content}}
</div>
</main>
{{footer}}
<script src="{{root}}js/site.js" defer></script>
</body>
</html>
